name: Release Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Importante: busca todo o histórico para ler a mensagem do commit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Busca a última tag Git e incrementa dinamicamente
      - name: Bump Version Dynamically
        run: |
          # 1. Captura a última tag Git do repositório (ex: v1.2.3)
          # Se não houver nenhuma tag, define o padrão inicial como v0.0.0
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Última tag encontrada: $LAST_TAG"
          
          # Remove o prefixo 'v' se existir (de v1.2.3 para 1.2.3)
          CLEAN_VERSION="${LAST_TAG#v}"
          
          # Divide a versão em Major, Minor e Patch usando o ponto (.) como separador
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          
          # Garante que as variáveis sejam numéricas (caso falte algum campo)
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # 2. Pega a mensagem do último commit para decidir o tipo de bump
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Mensagem do commit: $COMMIT_MSG"
          
          # 3. Aplica as regras de incremento semântico baseadas no commit
          if [[ "$COMMIT_MSG" == *"[major]"* ]] || [[ "$COMMIT_MSG" == *"#major"* ]] || [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]]; then
            echo "Detectado incremento de MAJOR"
            NEW_MAJOR=$((MAJOR + 1))
            NEW_VERSION="$NEW_MAJOR.0.0"
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]] || [[ "$COMMIT_MSG" == *"#minor"* ]] || [[ "$COMMIT_MSG" == *"feat:"* ]] || [[ "$COMMIT_MSG" == *"feat("* ]]; then
            echo "Detectado incremento de MINOR"
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="$MAJOR.$NEW_MINOR.0"
          else
            echo "Padrão ou detectado incremento de PATCH"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          fi
          
          echo "Nova versão calculada: $NEW_VERSION"
          
          # 4. Atualiza o arquivo pom.xml com a versão exata que calculamos via Bash
          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false
          
          # Salva a nova versão na variável global do pipeline para as próximas etapas
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # 2. Builda o pacote JAR usando a nova versão estabelecida
      - name: Build with Maven
        run: mvn -B package -DskipTests

      # 3. Commita a alteração do pom.xml e envia a nova Tag para o Git
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add pom.xml
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]"
          git push origin main
          git tag v${{ env.NEW_VERSION }}
          git push origin v${{ env.NEW_VERSION }}

      # 4. Cria a Release no GitHub anexando o JAR gerado
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release ${{ env.NEW_VERSION }}
          files: target/*.jar

      # 5. Autentica no Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Builda e envia a Imagem Docker atualizada com as novas tags
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cbms-estrela:${{ env.NEW_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cbms-estrela:latest