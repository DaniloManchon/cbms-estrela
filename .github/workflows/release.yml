name: Release Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Importante: busca todo o histórico para ler a mensagem do commit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Analisa a mensagem do commit e incrementa dinamicamente
      - name: Bump Version Dynamically
        run: |
          # Pega a mensagem do último commit
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Mensagem do commit: $COMMIT_MSG"
          
          # Define a regra de incremento com base na mensagem (Padrão: Patch)
          BUMP_TYPE="nextIncrementalVersion"
          
          if [[ "$COMMIT_MSG" == *"[major]"* ]] || [[ "$COMMIT_MSG" == *"#major"* ]] || [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]]; then
            echo "Detectado incremento de MAJOR"
            BUMP_TYPE="nextMajorVersion"
            VERSION_PATTERN="\${parsedVersion.nextMajorVersion}.0.0"
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]] || [[ "$COMMIT_MSG" == *"#minor"* ]] || [[ "$COMMIT_MSG" == *"feat:"* ]] || [[ "$COMMIT_MSG" == *"feat("* ]]; then
            echo "Detectado incremento de MINOR"
            VERSION_PATTERN="\${parsedVersion.majorVersion}.\${parsedVersion.nextMinorVersion}.0"
          else
            echo "Padrão ou detectado incremento de PATCH"
            VERSION_PATTERN="\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion}"
          fi
          
          # Executa o Maven com o padrão escolhido
          mvn build-helper:parse-version versions:set -DnewVersion=$VERSION_PATTERN -DgenerateBackupPoms=false
          
          # Salva a nova versão gerada na variável de ambiente
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "NEW_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV

      # 2. Builda o pacote JAR usando a nova versão estabelecida
      - name: Build with Maven
        run: mvn -B package -DskipTests

      # 3. Commita a alteração do pom.xml e envia a nova Tag para o Git
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add pom.xml
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]"
          git push origin main
          git tag v${{ env.NEW_VERSION }}
          git push origin v${{ env.NEW_VERSION }}

      # 4. Cria a Release no GitHub anexando o JAR gerado
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: Release ${{ env.NEW_VERSION }}
          files: target/*.jar

      # 5. Autentica no Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Builda e envia a Imagem Docker atualizada com as novas tags
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cbms-estrela:${{ env.NEW_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cbms-estrela:latest